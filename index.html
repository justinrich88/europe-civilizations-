<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concert of Europe — 1914</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ── top HUD ─────────────────────────────────────────────────────── -->
  <header class="hud" id="hud">
    <div class="hud-group">
      <span class="hud-stat"><span class="hud-label">Territories</span><span class="hud-value" id="stat-territories">—</span></span>
      <span class="hud-stat"><span class="hud-label">Forces</span><span class="hud-value" id="stat-forces">—</span></span>
    </div>

    <div class="hud-group speed" id="speed-controls">
      <!-- 1x deleted 2026-07 on the player's instruction; 2x is the default and
           the slow speed now. See BAL.SPEEDS for why this costs nothing: the
           loop scales time CONSUMED, never the timestep, so the sim at 2x is
           the same sim. Pause is still how you stop to read the board. -->
      <button type="button" class="btn speed-btn" data-speed="0" id="speed-pause" title="Pause (space)">&#9208;</button>
      <button type="button" class="btn speed-btn is-active" data-speed="2">2x</button>
      <button type="button" class="btn speed-btn" data-speed="4">4x</button>
    </div>

    <div class="hud-group">
      <span class="hud-stat"><span class="hud-label">Day</span><span class="hud-value" id="stat-day">0</span></span>
    </div>
  </header>

  <!-- ── stage: board + right rail ───────────────────────────────────────
       A ROW flex whose only job is to put the rail beside the board rather
       than on top of it. This shape is load-bearing, not cosmetic: anything
       painted over the board that accepts pointer events swallows the click
       that commits an attack, with no error at all (see the #g-ui note
       below). A DOM sibling in normal flow cannot do that by construction.

       The SVG has a viewBox and preserveAspectRatio="xMidYMid meet", so
       narrowing .board-wrap simply rescales the map; render/camera.js has a
       ResizeObserver on #board and rebuilds its fit rect, which is what keeps
       marquee selection aligned with what the player sees.

       render/ailog.js still inserts its panel into .app immediately above
       .bottombar — i.e. below this whole row — so the log and the rail
       displace the board on different axes and never fight. -->
  <div class="stage">

  <main class="board-wrap">
    <!-- tools/build-map.js fits the projected geometry to this frame with a
         small margin, so the viewBox is fixed and the data does the framing. -->
    <svg id="board" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="1914 Europe strategic map">
      <defs id="board-defs"></defs>
      <g id="g-territories"></g>
      <!-- Multiplier coverage (§8: "hold a farm and see the territories it's
           boosting light up"). Above the territory fill so it reads as a wash
           over the country, below the borders so it never eats a coastline.
           pointer-events:none in style.css — see the #g-ui warning below. -->
      <g id="g-coverage"></g>
      <g id="g-borders"></g>
      <g id="g-links"></g>
      <g id="g-stations"></g>
      <g id="g-labels"></g>
      <!-- Waves sit ABOVE stations: a marker on a short link next to a large
           node was being swallowed by that node's silhouette, and §8 requires
           in-transit strength to be legible at a glance. Both this layer and
           #g-ui are pointer-events:none in style.css, so neither can eat the
           click that commits an attack. -->
      <g id="g-waves"></g>
      <g id="g-ui"></g>
    </svg>
  </main>

    <!-- The rail. Persistent, fixed width, never hidden, never animated: the
         player must never have to look for where information appeared.
         Sections are appended by JS through railAddSection() — see the seam
         documented in render/readout.js and 01-data-schema.md. The element is
         empty here on purpose so adding a section never means editing this
         file. -->
    <aside class="rail" id="rail" aria-label="Status"></aside>

  </div>

  <!-- ── bottom bar ──────────────────────────────────────────────────── -->
  <footer class="bottombar">
    <div class="send-control" id="send-control">
      <span class="hud-label">send</span>
      <!-- ONE-SHOT, and the digit that selects each one is on its face. The
           active button relaxes back to 25 after every volley (render/select.js,
           selCommit) — see BAL.SEND_FRACTION_DEFAULT for the player's reasoning.
           data-key is read by nothing; it is a label, and the binding itself is
           derived from BAL.SEND_FRACTIONS so the two cannot drift. -->
      <button type="button" class="btn send-btn is-active" data-fraction="0.25"><b>1</b>25</button>
      <button type="button" class="btn send-btn" data-fraction="0.5"><b>2</b>50</button>
      <button type="button" class="btn send-btn" data-fraction="0.75"><b>3</b>75</button>
      <button type="button" class="btn send-btn" data-fraction="1"><b>4</b>All</button>

      <!-- What the NEXT click will do, while a supply line is armed by R
           (render/select.js, _selPaintArmed). Rendered as a fixed banner at the
           top of the board, not here — see the `.send-armed` rule, which
           explains why it must not sit in this bar's flow. It lives in this
           element only because the send box is where it conceptually belongs. -->
      <span class="send-armed" id="send-armed" hidden aria-live="polite"></span>

      <!-- The INF · ART · ARM type toggles used to sit here. Deleted 2026-07 on
           the player's instruction ("Delete them."). Choosing SOURCES already
           chooses types — the Ruhr makes armour, Leipzig makes artillery,
           everywhere else infantry — so the toggles only bought "send this
           city's infantry but leave its guns", which is not worth a permanent
           mode on a bar the player fires volleys from. `cmd.types` still exists
           in sim/commands.js; nothing in the UI sets it. -->
    </div>

    <!-- Discoverability for the gesture table in render/select.js. Nothing else
         on screen would ever tell you that the friendly march lives on the RIGHT
         button, or that the amount can be overridden at the moment of the click.
         Always visible — the player's window is 800px and the old
         `@media (max-width:1000px){display:none}` meant this line did not exist
         for them at all. It now wraps to its own row instead of vanishing.

         Tiers: `.is-basic` items describe what anyone discovers in ten seconds
         and are the first to go; the modifiers and the right button are the ones
         that are genuinely unguessable, so they are the last to go. -->
    <p class="send-hint" id="send-hint">
      <span class="send-hint-item is-basic"><b>click</b> yours = select</span>
      <span class="send-hint-item is-basic"><b>click</b> enemy = attack</span>
      <span class="send-hint-item is-basic"><b>1&#8202;2&#8202;3&#8202;4</b> = 25&#8202;&#183;&#8202;50&#8202;&#183;&#8202;75&#8202;&#183;&#8202;all</span>
      <!-- "move", not "reinforce". R is now the standing REINFORCE order, and
           two different gestures both called reinforce — one a single march, one
           a permanent supply line — is the kind of collision that makes a hint
           line worse than no hint line. -->
      <span class="send-hint-item"><b>right-click</b> = move</span>
      <span class="send-hint-item"><b>&#8984;</b>click = keep group</span>
      <!-- Standing orders (render/select.js, _selApplyOrder). Not `.is-basic`:
           a key that acts on the current selection is invisible to anyone who
           does not already know it exists, which is precisely the tier this
           line is for. Written as a two-step because that is what it is now —
           the key ARMS, the next click on your own ground names the destination.
           The old bare `H R F` needed no target and so needed no arrow.

           The shift = all / alt = half commit modifiers that used to sit on
           this line are gone: 1-4 does the same job with one hand and no timing,
           and shift was already overloaded as additive-select on the same
           pointer. Cmd stays — keeping the group is not an amount. -->
      <span class="send-hint-item"><b>R</b>&#8202;&#8594;&#8202;click = supply on/off, <b>H</b> = clear</span>
    </p>

    <div class="powers" id="powers-strip"></div>

    <div class="ticker" id="ticker" aria-live="polite">
      <ul class="ticker-list" id="ticker-list"></ul>
    </div>
  </footer>

</div>

<!-- ── scripts: core -> data -> render -> app ───────────────────────────
     Loaded in dependency order as plain globals. No modules, no bundler.
     The data/ files are authored separately; render/map.js reports clearly
     and draws a placeholder if any global is still missing. -->

<script src="core/rng.js"></script>
<script src="core/util.js"></script>

<script src="data/map.js"></script>
<script src="data/stations.js"></script>
<script src="data/scenario.js"></script>
<script src="data/tuning.js"></script>

<script src="core/state.js"></script>

<!-- The fog gate. Immediately after core/state.js and BEFORE sim/, ai/ and
     render/, because both consumers (render masking, AI candidate filtering)
     load later and nothing in sim/ may call it at all. -->
<script src="core/vision.js"></script>

<script src="sim/commands.js"></script>
<script src="sim/growth.js"></script>
<script src="sim/movement.js"></script>
<script src="sim/combat.js"></script>
<script src="sim/relations.js"></script>
<script src="sim/victory.js"></script>
<script src="sim/step.js"></script>

<!-- ai/ is optional: sim/step.js calls aiTick only if it is defined, so the
     game still runs with these two tags removed. score.js first — ai.js reads
     aiCandidates/aiContext from it. -->
<script src="ai/score.js"></script>
<script src="ai/ai.js"></script>

<script src="render/map.js"></script>
<script src="render/waves.js"></script>
<script src="render/hud.js"></script>
<script src="render/select.js"></script>
<script src="render/ailog.js"></script>
<script src="render/coverage.js"></script>
<script src="render/readout.js"></script>
<script src="render/victory.js"></script>
<script src="render/camera.js"></script>
<!-- The empire picker. After the other render/ files because it calls map.js's
     shapePoints/pointsAttr to draw the homelands from the same geometry the
     board is drawn from, and before app/loop.js because app/main.js's boot()
     hands it the board and waits for a power before there is a game to run. -->
<script src="render/start.js"></script>

<script src="app/loop.js"></script>
<script src="app/main.js"></script>

</body>
</html>
