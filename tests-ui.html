<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concert of Europe — UI tests</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; background: #0c0f14; color: #c9d1d9;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex; height: 100vh;
  }
  #out { flex: 1 1 auto; margin: 0; padding: 14px; overflow: auto; white-space: pre; }
  #frame { flex: 0 0 800px; width: 800px; height: 900px; border: 0; border-left: 1px solid #222; }
  .ok   { color: #7ee787; }
  .bad  { color: #ff7b72; }
  .note { color: #8b949e; }
</style>
</head>
<body>

<pre id="out" class="note">starting…</pre>

<!-- THE PAGE UNDER TEST IS index.html ITSELF, IN AN IFRAME, AND THAT IS THE
     WHOLE POINT OF THIS FILE.

     render/select.js cannot be tested by either existing harness:
       test/node.js   — it calls document.addEventListener at the top level, so
                        it does not even evaluate in a context with no document.
       tests.html     — has no #board, no camera fit rect and no live GAME, so
                        every gesture assertion could only ever report SKIP.

     The obvious fix is to copy index.html's thirty <script> tags into a third
     page. That is known-issue #9 — two implementations of one rule — and it is
     the version of it that rots fastest, because the drift is invisible: the
     copy keeps passing while testing a page nobody ships. render/hud.js moved
     below render/readout.js earlier today for exactly this kind of load-order
     reason, and a duplicated list would have silently kept the old order.

     So there is no copy. The iframe loads the shipped page, and the test files
     are injected into it afterwards — which also keeps test scripts out of
     index.html, where they have no business being.

     ?player=ger skips the empire picker (00-vision.md §8) so the board is live
     and wired without anyone having to click a card. The iframe is a real
     800x900, the window the game is played at (known-issues #17) — the camera
     fit rect and elementFromPoint both depend on real layout, and a hidden or
     zero-sized frame would make every hit test a lie.

     &dev=1 IS LOAD-BEARING SINCE A4, not a convenience. Pause and speed left the
     player UI, and with them the opening pause — a player who cannot unpause must
     not be handed a board that never starts. But every gesture assertion below
     reads a garrison, hit-tests a node, or counts a wave, and a board that is
     RUNNING changes all three between the setup and the assertion. dev=1 is
     exactly what roadmap A4 kept these controls for: "browser verification pauses
     the board constantly and losing that slows every future change." -->
<iframe id="frame" src="index.html?player=ger&amp;dev=1" title="game under test"></iframe>

<script>
'use strict';

// The suites to inject, in order. asserts.js first (assert/resetTests), then
// runner.js (collectData/formatResults), then the suites themselves.
//
// THESE ARE THE SUITES test/node.js CANNOT RUN, and each is here for its own
// reason rather than by category:
//
//   select-tests      render/select.js calls document.addEventListener at the
//                     top level, so the node harness will not evaluate it at
//                     all, and the gestures hit-test real screen coordinates.
//   scenarios-routeview
//                     needs render/map.js's route classifier. That file could
//                     be shimmed into test/node.js with a fake `window` and a
//                     fake `document`, and it was tried; a render file in the
//                     sim harness, propped up by two stubs, is a worse thing to
//                     own than one extra page. Here it is the real file, loaded
//                     by the real index.html, against a rendered board.
//
// It must NOT go in tests.html either: that page has no #board, so the suite
// would SKIP — and a SKIP prints under a PASS banner, which is how a suite goes
// quietly dead. Being loud about not running is the whole job of this file.
var TEST_FILES = [
  'test/asserts.js',
  'test/runner.js',
  'test/select-tests.js',
  'test/camera-tests.js',
  // Headless-capable (it runs as `node test/scenarios-orderswhy.js` too), but
  // it needs render/readout.js AND render/map.js, and putting two render files
  // into the sim harness behind a fake window and a fake document is the same
  // trade declined for scenarios-routeview.js. Here both are the real files,
  // loaded by the real index.html, in the real order — which is also what
  // proves its MAP_ORDER_STUCK guard resolves at CALL time rather than at load.
  'test/scenarios-orderswhy.js',
  // Loaded for its BOARD FIXTURES, not to be run — scenarios-routeview.js
  // reuses them rather than copying them, which is the right call
  // (known-issues #9) and the reason this line is not obviously necessary.
  // Its own assertions run headless in test/node.js; `suiteRoutes` is
  // deliberately absent from TEST_SUITES below so they do not run twice.
  'test/scenarios-routes.js',
  'test/scenarios-routeview.js',
  // render/map.js's development mark. Same argument as the two above: the node
  // harness loads no render/ file that draws a station, so a green there says
  // nothing about this code at all.
  'test/devmark-tests.js',
  // render/map.js's fog MEMO, which B2 turned into a correctness surface: a
  // wave is now a source of sight and a wave can appear with the tick and the
  // ownerEpoch both unmoved. Headless coverage of the rule itself is complete
  // (test/fog-tests.js, `fog / wave vision`) and cannot see this at all.
  'test/wavefog-tests.js',
  // The supply route as a CLICK TARGET (C3). Entirely about what
  // elementFromPoint returns on a laid-out board, so the node harness could
  // never see it.
  'test/routehit-tests.js',
];

// Suite entry points to call, in order. Named rather than discovered so a suite
// that fails to load is a hard error below instead of silently not running.
//
// THEY RUN ONE AT A TIME, AND EACH IS AWAITED. test/asserts.js keeps a single
// module-global `_currentSuite` and every assert() pushes into it, so a suite
// that returns a promise — test/camera-tests.js does, because MutationObserver
// is asynchronous — would file its assertions under the NEXT suite's name if
// this loop moved on without waiting. Silently, with the totals still adding
// up. Awaiting a non-promise is free, so the rule is simply: always wait.
var TEST_SUITES = ['suiteSelect', 'suiteSelectSafety', 'suiteRouteView', 'suiteCamera',
                   'suiteOrdersWhy', 'suiteDevMark', 'suiteWaveFog', 'suiteRouteHit'];

var out = document.getElementById('out');
var frame = document.getElementById('frame');

function say(text, cls) {
  out.className = cls || 'note';
  out.textContent = text;
}

// Inject one classic script into the frame and resolve when it has run. Written
// with <script src> rather than eval so a syntax error reports with a real
// filename and line number, exactly as it would on the shipped page.
function inject(doc, src) {
  return new Promise(function (resolve, reject) {
    var s = doc.createElement('script');
    s.src = src;
    s.onload = function () { resolve(src); };
    s.onerror = function () { reject(new Error('failed to load ' + src)); };
    doc.body.appendChild(s);
  });
}

// The board is drawn asynchronously and app/main.js does not announce itself, so
// poll for the two things the gesture tests actually need: a live GAME and a
// station node that can be hit-tested. Polling a real condition rather than
// sleeping a guessed number of milliseconds is the difference between a flaky
// suite and a slow one.
function waitForGame(win, doc, timeoutMs) {
  var deadline = Date.now() + (timeoutMs || 15000);
  return new Promise(function (resolve, reject) {
    (function poll() {
      var ready = win.GAME && win.PLAYER &&
        doc.querySelector('#g-stations .station-shape');
      if (ready) return resolve();
      if (Date.now() > deadline) {
        return reject(new Error('no live GAME in the frame after ' +
          (timeoutMs / 1000) + 's — did index.html throw? Check its console.'));
      }
      setTimeout(poll, 60);
    }());
  });
}

// CLOSE THE GUIDE, AND FAIL LOUDLY IF IT WILL NOT CLOSE.
//
// render/help.js auto-shows the guide ONCE PER BROWSER, keyed on a localStorage
// flag. That makes this page's result depend on the history of whatever browser
// opened it:
//
//   a browser that has seen the guide   the board is clear, 34 tests run
//   a browser that has NOT              the guide's <p> is over every station,
//                                       so _seltFixture's hit test misses every
//                                       neighbour, and suiteSelect fires its one
//                                       loud failure and returns — 11 of its 12
//                                       tests never register at all
//
// Which is worse than a plain red: the page still prints a totals line, and the
// totals line is smaller by eleven in a way nobody counts. It passed for the
// author for weeks because his profile had the flag set, and went red the first
// time it ran in a fresh profile.
//
// So the guide is closed here, through its own helpHide() rather than by writing
// the localStorage key from this file — the key is render/help.js's business and
// a copy of it here would drift silently the day it becomes v2 (known-issue #9).
// This is the same job `?player=ger` on the iframe already does: put the SHIPPED
// page into the state a player is in when they start giving orders.
//
// A guide that will not close is a hard error, not a warning. If something is
// over the board and cannot be moved, every gesture assertion below is measuring
// an overlay, and this page exists to say so out loud.
function dismissGuide(win, doc) {
  var open = win.HELP_STATE && win.HELP_STATE.open;
  if (!open) return;                     // already seen in this browser
  if (typeof win.helpHide !== 'function') {
    throw new Error('the guide is open over the board and render/help.js exposes ' +
      'no helpHide() — every gesture test below would hit-test the guide');
  }
  win.helpHide();
  if (win.HELP_STATE && win.HELP_STATE.open) {
    throw new Error('helpHide() ran and the guide is still open — the board is ' +
      'covered and no gesture assertion on this page means anything');
  }
  if (doc.querySelector('.help-p')) {
    throw new Error('the guide reports closed but its content is still in the ' +
      'document — known-issue #15/#20 territory, and the hit test will still miss');
  }
}

frame.addEventListener('load', function () {
  var win = frame.contentWindow;
  var doc = frame.contentDocument;

  say('waiting for the board…');

  waitForGame(win, doc)
    .then(function () {
      dismissGuide(win, doc);
      say('injecting suites…');
      return TEST_FILES.reduce(function (chain, src) {
        return chain.then(function () { return inject(doc, src); });
      }, Promise.resolve());
    })
    .then(function () {
      // A missing suite is a HARD ERROR, never a quiet skip. The whole failure
      // mode this page exists to prevent is a suite that stops running and goes
      // on printing a green banner (known-issues #8, and #22's silent guard).
      var missing = TEST_SUITES.filter(function (n) {
        return typeof win[n] !== 'function';
      });
      if (missing.length) {
        throw new Error('these suites loaded but exposed no entry point: ' +
          missing.join(', ') + ' — did a name change?');
      }

      win.resetTests();
      var d = (typeof win.collectData === 'function') ? win.collectData() : {};
      // Sequential and awaited — see the note on TEST_SUITES.
      return TEST_SUITES.reduce(function (chain, n) {
        return chain.then(function () { return win[n](d); });
      }, Promise.resolve());
    })
    .then(function () {
      var summary = win.summarizeTests();
      var text = (typeof win.formatResults === 'function')
        ? win.formatResults()
        : JSON.stringify(summary, null, 2);

      // A SKIP is a failure HERE, whatever it means elsewhere. In test/node.js
      // skipping is how the harness survives data files that are not authored
      // yet; on this page every suite's dependencies are loaded by definition,
      // so a skip can only mean the suite could not find what it needed and
      // said nothing about it.
      //
      // AN EMPTY SUITE IS A FAILURE TOO, and that rule is here because the
      // absence of it let a suite through. test/asserts.js only records via
      // test(name, fn); a bare assert() throws on failure and records NOTHING
      // on success, so a suite written with bare assertions measured the right
      // things, asserted the right things, reported 0/0 and printed green.
      // `summary.skip` did not catch it because there was nothing to skip.
      // known-issue #8: a test that cannot fail is worse than no test, and a
      // suite that cannot report is the same thing one level up.
      var empty = [];
      for (var i = 0; i < win.TEST_RESULTS.length; i++) {
        var s = win.TEST_RESULTS[i];
        if (!s.skipped && s.tests.length === 0) empty.push(s.name);
      }

      var bad = summary.fail > 0 || summary.skip > 0 || empty.length > 0;
      var notes = '';
      if (summary.skip > 0) {
        notes += '\n\n!! ' + summary.skip + ' SKIPPED — a skip is a failure on ' +
          'this page: every dependency is loaded here, so a suite that skipped ' +
          'could not find something and did not say so.';
      }
      if (empty.length) {
        notes += '\n\n!! ' + empty.length + ' SUITE(S) RECORDED NOTHING: ' +
          empty.join(', ') + '\n   A suite that runs and asserts nothing is ' +
          'the loudest possible green lie. Check for bare assert() calls ' +
          'outside test(name, fn).';
      }
      say(text + notes, bad ? 'bad' : 'ok');

      // Machine-readable, so a browser-driving harness can read one value
      // instead of scraping the <pre>.
      window.UI_TEST_SUMMARY = summary;
      document.title = (bad ? 'FAIL' : 'PASS') + ' — UI tests';
    })
    .catch(function (e) {
      say('HARNESS ERROR\n\n' + (e && e.stack ? e.stack : String(e)), 'bad');
      window.UI_TEST_SUMMARY = { pass: 0, fail: -1, error: String(e) };
      document.title = 'FAIL — UI tests';
    });
});
</script>

</body>
</html>
